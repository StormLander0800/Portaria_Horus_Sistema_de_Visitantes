
{% extends "base.html" %}
{% block content %}
<section class="card kpis">
  <h2>Dashboard</h2>
  <div class="grid">
    <div class="kpi"><div class="kpi-value">{{ open_vis_count }}</div><div class="kpi-label">Entradas abertas (visitantes/fornecedores)</div></div>
    <div class="kpi"><div class="kpi-value">{{ late_today }}</div><div class="kpi-label">Atrasos de alunos (hoje)</div></div>
    <div class="kpi"><div class="kpi-value">{{ base_class_time }}</div><div class="kpi-label">Horário base (atraso)</div></div>
  </div>
</section>

<section class="card quick">
  <h3>Acesso rápido</h3>
  <div class="quick-actions">
    <a class="button" href="{{ url_for('index') }}">Registrar Visitante</a>
    <a class="button" href="{{ url_for('students_checkin') }}">Chegada de Aluno</a>
    <a class="button" href="{{ url_for('students_import') }}">Importar Alunos</a>
  </div>
</section>
{% endblock %}
